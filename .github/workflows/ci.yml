name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  svg-security:
    name: SVG security check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan SVG files for dangerous JavaScript
        run: |
          DANGEROUS=$(grep -rl \
            -e 'XMLHttpRequest' \
            -e 'fetch(' \
            -e 'eval(' \
            -e 'document\.write' \
            -e 'window\.location' \
            -e 'localStorage' \
            -e 'sessionStorage' \
            -e 'indexedDB' \
            -e 'navigator\.' \
            -e 'WebSocket' \
            -e 'import(' \
            --include="*.svg" . 2>/dev/null || true)
          if [ -n "$DANGEROUS" ]; then
            echo "ERROR: SVG files contain dangerous JavaScript:"
            echo "$DANGEROUS"
            exit 1
          fi
          echo "SVG security check passed."
