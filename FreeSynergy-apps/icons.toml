# Programme icon set `freesynergy` (mixed): form and motifs from the former serious draft (square-ish tile with small
# corner radius, flat details, own drawing, 128x128 viewBox), colours and the soft top-left highlight from the playful set
# (FreeSynergy-playful/). -symbolic companions (16x16, currentColor) keep the serious shapes.
# The serious draft (id `freesynergy-serious`) was consumed into this set and is no longer a set of its own.
# Not a catalogue entry yet. See docs/program-icons.md.
[set]
id = "freesynergy"
name = "FreeSynergy"
kind = "icon-set"
license = "MIT"
license_files = ["LICENSE-MIT"]
origin = "Drawn by the FreeSynergy project; nothing traced from another set. Form from the former freesynergy-serious draft, colours from freesynergy-playful."

[[icon]]
name = "fs-store"
file = "apps/fs-store.svg"
context = "apps"
naming = "own"
meaning = "A crate with lid and tape and an arrow dropping in: the package store."
purpose = "Programme icon of fs-store."
purpose_de = "Programm-Icon von fs-store."
used_in = ["fs-store"]
sizes = ["scalable"]
variants = ["symbolic"]
status = "draft-review"

