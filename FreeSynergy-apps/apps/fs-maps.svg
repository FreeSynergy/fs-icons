  <path d="M52 86l24 8" fill="none" stroke="#67E8F9" stroke-width="5" stroke-linecap="round"/>
  <!-- location pin -->
  <path d="M64 92C51 77 47 69 47 59a17 17 0 0 1 34 0c0 10-4 18-17 33z" fill="#FB7185"/>
  <path d="M64 92C51 77 47 69 47 59a17 17 0 0 1 8-14.4C52 52 53 70 64 92z" fill="#E11D48" opacity="0.45"/>
  <circle cx="64" cy="58" r="7" fill="#FFFFFF"/>
</svg>
