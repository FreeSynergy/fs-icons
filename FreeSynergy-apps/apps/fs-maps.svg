<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tile" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.7" y2="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="10" fill="url(#tile)"/>
  <rect x="8" y="8" width="112" height="112" rx="10" fill="url(#gloss)"/>
  <!-- map shadow -->
  <path d="M22 46l26-10 32 10 26-10v60l-26 10-32-10-26 10z" fill="#164E63" opacity="0.28"/>
  <!-- folded map: three panels -->
  <path d="M22 42l26-10v60l-26 10z" fill="#CFFAFE"/>
  <path d="M48 32l32 10v60L48 92z" fill="#FFFFFF"/>
  <path d="M80 42l26-10v60l-26 10z" fill="#A5F3FC"/>
  <!-- park and river details -->
  <path d="M84 52l18-6v14l-18 6z" fill="#86EFAC"/>
