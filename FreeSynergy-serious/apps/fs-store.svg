  </defs>
  <rect x="8" y="8" width="112" height="112" rx="10" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="9.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <!-- arrow into the crate -->
  <path d="M64 20v22M53 33l11 11 11-11" fill="none" stroke="#F4F1EA" stroke-width="5" stroke-linejoin="miter"/>
