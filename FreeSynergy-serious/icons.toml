# Serious programme icon set: second, calmer take on the seven programme icons (own drawing, 128x128 viewBox,
# small corner radius, muted colours, no gloss/shadow) with -symbolic companions (16x16, currentColor).
# Draft for review; not a catalogue entry yet. Compare with the playful set in ../FreeSynergy/apps. See docs/program-icons-serious.md.
[set]
id = "freesynergy-serious"
name = "FreeSynergy programme icons (serious)"
kind = "icon-set"
license = "MIT"
license_files = ["LICENSE-MIT"]
origin = "Drawn by the FreeSynergy project; nothing traced from another set."

[[icon]]
name = "fs-store"
file = "apps/fs-store.svg"
context = "apps"
naming = "own"
meaning = "A crate with lid and tape and an arrow dropping in: the package store."
purpose = "Programme icon of fs-store."
purpose_de = "Programm-Icon von fs-store."
used_in = ["fs-store"]
sizes = ["scalable"]
variants = ["symbolic"]
status = "draft-review"

