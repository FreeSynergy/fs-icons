# Playful programme icon set: first take on the seven programme icons (own drawing, 128x128 viewBox, rounded tile radius 28,
# colour gradients, soft gloss and hard shadow) with -symbolic companions (16x16, currentColor). Stays selectable next to the
# mixed set `freesynergy` (FreeSynergy-apps/). Not a catalogue entry yet. See docs/program-icons-playful.md.
[set]
id = "freesynergy-playful"
name = "FreeSynergy Playful"
kind = "icon-set"
license = "MIT OR Apache-2.0"
license_files = ["LICENSE-MIT", "LICENSE-APACHE"]
origin = "Drawn by the FreeSynergy project; nothing traced from another set."

[[icon]]
name = "fs-store"
file = "apps/fs-store.svg"
context = "apps"
naming = "own"
meaning = "A parcel box with tape and an arrow dropping in: the package store."
purpose = "Programme icon of fs-store."
purpose_de = "Programm-Icon von fs-store."
used_in = ["fs-store"]
sizes = ["scalable"]
variants = ["symbolic"]
status = "draft-review"

