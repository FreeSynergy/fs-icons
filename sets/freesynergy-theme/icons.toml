context = "actions"
naming = "own"
source_name = "mail"
meaning = "An envelope: e-mail address."
purpose = "Mail address of a person or a message button."
purpose_de = "E-Mail-Adresse einer Person oder Schaltfläche für Nachrichten."
used_in = ["fs-files"]
sizes = ["scalable"]
variants = ["symbolic"]
status = "draft-colour"

